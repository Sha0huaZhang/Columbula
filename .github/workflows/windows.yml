name: windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        working-directory: columbula
        run: |
          :: 批处理必须用 call 调用，否则 build.bat 结束时不会返回到这里的后续命令
          call build.bat
          if errorlevel 1 exit /b 1
          copy /y dist\columbula-windows.exe dist\Columbula.exe
          if errorlevel 1 exit /b 1
          dir dist

      - name: Smoke test
        shell: cmd
        working-directory: columbula
        run: |
          dist\Columbula.exe -v
          dist\Columbula.exe -p > out.txt
          findstr /C:"Dormi cara columbula~" out.txt
          findstr /C:"O columbula mea~~" out.txt
          certutil -hashfile dist\Columbula.exe SHA256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Columbula-windows-x64
          path: columbula/dist/Columbula.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: columbula/dist/Columbula.exe
